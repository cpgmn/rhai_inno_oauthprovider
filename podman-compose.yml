version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-identity_and_access}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  authprovider:
    build:
      context: ./innovationcloud_authprovider
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-identity_and_access}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:6060}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    ports:
      - "6060:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  authclient:
    build:
      context: ./authclient
      dockerfile: Dockerfile
    environment:
      PROVIDER_URL: ${PROVIDER_URL:-http://authprovider:8000}
      CLIENT_ID: ${CLIENT_ID:-test-public-client}
      CLIENT_SECRET: ${CLIENT_SECRET:-}
      REDIRECT_URI: ${REDIRECT_URI:-http://localhost:3000/callback}
    ports:
      - "3000:8000"
    depends_on:
      - authprovider
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
